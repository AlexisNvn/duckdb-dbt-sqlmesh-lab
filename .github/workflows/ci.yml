name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - name: Unit tests and framework lifecycle checks
        run: uv run --frozen pytest -k "not test_three_framework_equivalence"
      - name: Build all three stacks and verify fixture equivalence
        run: uv run --frozen pytest tests/test_equivalence.py::test_three_framework_equivalence
