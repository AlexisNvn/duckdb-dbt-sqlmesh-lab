[project]
name = "local-analytics-stack-benchmark"
version = "0.1.0"
description = "Reproducible DuckDB, dbt and SQLMesh experiments"
requires-python = ">=3.11,<3.12"
dependencies = ["duckdb==1.3.2", "dbt-core==1.10.11", "dbt-duckdb==1.9.6", "sqlmesh==0.213.0", "matplotlib==3.10.6"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.0"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
